  <path d="M170 520 H1430" stroke="#8ca99a" stroke-width="8" stroke-dasharray="20 20"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#0a0f0d"><circle cx="230" cy="520" r="84"/><circle cx="610" cy="520" r="84"/><circle cx="990" cy="520" r="84"/><circle cx="1370" cy="520" r="84"/></g><g fill="#34d399" font-size="42" font-weight="700"><text x="230" y="535">01</text><text x="610" y="535">02</text><text x="990" y="535">03</text><text x="1370" y="535">04</text></g><g fill="#102019" font-size="28" font-weight="700"><text x="230" y="660">PLAN</text><text x="610" y="660">VERIFY</text><text x="990" y="660">TRACK</text><text x="1370" y="660">REPORT</text></g></g>
